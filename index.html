<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cute bear-themed number guessing game built with JavaScript functions.">
  <meta name="theme-color" content="#f5e9d8">
  <title>Guess the Number | Bear Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="script.js?v=3" defer></script>
</head>
<body>
  <main class="game-card">
    <div class="top-label"><span>✦</span> A LITTLE BEAR GAME <span>✦</span></div>

    <div class="bear-scene" aria-hidden="true">
      <span class="sparkle sparkle-one">✦</span>
      <span class="sparkle sparkle-two">✧</span>
      <div class="bear">🧸</div>
      <span class="tiny-heart">♥</span>
    </div>

    <h1>Guess the Number!</h1>
    <p class="subtitle">ก้อนหมีแอบซ่อนตัวเลขไว้ให้แล้วนะ<br>ลองทายดูสิว่าเป็นเลขอะไร <span>♡</span></p>

    <section class="game-area" aria-label="Number guessing game">
      <div class="range-pill">NUMBER RANGE <strong>0 – 10</strong></div>

      <label for="guessInput">Your lucky number</label>
      <div class="input-row">
        <input id="guessInput" type="number" min="0" max="10" step="1"
          placeholder="ใส่เลข 0 - 10" inputmode="numeric" autocomplete="off">
        <button id="guessButton" type="button">ทายเลย! <span>♡</span></button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite">
        <span class="message-icon" aria-hidden="true">🐻</span>
        พร้อมแล้ว! หมีรอฟังคำตอบอยู่นะ
      </p>

      <div class="stats">
        <div class="stat-box">
          <span class="stat-icon">🍯</span>
          <span class="stat-value" id="attempts">0</span>
          <span class="stat-label">จำนวนครั้งที่ทาย</span>
        </div>
        <div class="stat-box">
          <span class="stat-icon">🎯</span>
          <span class="stat-value">0–10</span>
          <span class="stat-label">ช่วงตัวเลข</span>
        </div>
      </div>

      <button id="restartButton" class="restart-button" type="button">↻ เริ่มเกมใหม่</button>
    </section>

    <p class="footer-note">made with love & a little bear <span>♡</span></p>
  </main>
</body>
</html>
